const devRpc = async (op, payload = {}) => {
  const p = payload;
  switch (op) {
    case "load":
      return {
        members: [...devDb.members].sort((a, b) => a.id - b.id),
        groups: devDb.groups.map((g) => ({ id: g.id, name: g.name, member_ids: g.member_ids })),
        games: [...devDb.games].sort((a, b) => a.id - b.id),
        seasons: [...devDb.seasons].sort((a, b) => a.id - b.id),
      };
    case "ins_member": devDb.members.push({ id: p.id, name: p.name, color: p.color ?? null }); return {};
    case "upd_member": devDb.members.forEach((m) => { if (m.id === p.id) m.name = p.name; }); return {};
    case "upd_avatar": devDb.members.forEach((m) => { if (m.id === p.id) m.avatar = p.avatar || null; }); return {};
    case "del_member":
      devDb.members = devDb.members.filter((m) => m.id !== p.id);
      devDb.groups.forEach((g) => { g.member_ids = g.member_ids.filter((x) => x !== p.id); });
      return {};
    case "ins_group": devDb.groups.push({ id: p.id, name: p.name, member_ids: p.member_ids }); return {};
    case "del_group": devDb.groups = devDb.groups.filter((g) => g.id !== p.id); return {};
    case "ins_game": devDb.games.push({ id: p.id, date: p.date, entries: p.entries }); return {};
    case "upd_game":
      devDb.games = devDb.games.map((g) => (g.id === p.id ? { id: p.id, date: p.date, entries: p.entries } : g));
      return {};
    case "ins_season":
      devDb.seasons.push({ id: p.id, name: p.name, start_date: p.start_date, end_date: p.end_date || null, closed: !!p.closed });
      return {};
    case "upd_season":
      devDb.seasons = devDb.seasons.map((x) => (x.id === p.id
        ? { id: p.id, name: p.name, start_date: p.start_date, end_date: p.end_date || null, closed: !!p.closed } : x));
      return {};
    case "del_season": devDb.seasons = devDb.seasons.filter((x) => x.id !== p.id); return {};
    case "del_game": devDb.games = devDb.games.filter((g) => g.id !== p.id); return {};
    case "import":
      devDb.games = []; devDb.groups = []; devDb.members = [];
      (p.members || []).forEach((x) => devDb.members.push(x));
      (p.groups || []).forEach((x) => devDb.groups.push(x));
      (p.games || []).forEach((x) => devDb.games.push(x));
      return {};
    default: throw new Error("op");
  }
};

  // ===== データの書き出し / 読み込み =====
  const APP_FORMAT = "mleague-tracker";
  const FORMAT_VERSION = 1;

  const exportData = () => {
    const payload = {
      format: APP_FORMAT,
      version: FORMAT_VERSION,

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const pad = (x) => String(x).padStart(2, "0");
    a.href = url;
    a.download = `麻雀成績_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setIoMsg({ ok: true, text: `${games.length}半荘分を書き出しました。` });
  };

  const readFile = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (d.format !== APP_FORMAT) throw new Error("format");
        if (!Array.isArray(d.members) || !Array.isArray(d.games)) throw new Error("shape");
        // メンバー・グループ・半荘のいずれかが壊れていたら読み込まない

        if (d.groups != null && !Array.isArray(d.groups)) throw new Error("shape");
        if (d.seasons != null && !Array.isArray(d.seasons)) throw new Error("shape");

        const badGroup = (d.groups || []).some(

          body: `メンバー ${d.members.length}人 / グループ ${(d.groups || []).length}件 / ${d.games.length}半荘`
            + ((d.seasons || []).length ? ` / シーズン ${d.seasons.length}件` : ""),
          note: "全員の共有記録がすべて置きかわります。先に書き出しておくと安心です。",
          okLabel: "読み込む",
          onOk: async () => {
            try {

              const mMap = new Map();

                const nid = Number.isInteger(m.id) ? m.id : i + 1;
                mMap.set(m.id, nid);
                return { id: nid, name: m.name, color: m.color || null, avatar: m.avatar || null };
              });
              const ng = (d.groups || []).map((g, i) => ({
                id: Number.isInteger(g.id) ? g.id : 9000 + i,
                name: g.name,
                member_ids: g.memberIds.map((x) => mMap.get(x) ?? x),
              }));
              const nga = d.games.map((g) => ({
                id: g.id,
                date: g.date,
                entries: g.entries.map((e) => ({ ...e, memberId: mMap.get(e.memberId) ?? e.memberId })),
              }));
              await rpc("import", { members: nm, groups: ng, games: nga });
              // シーズンはimportの対象外なので、個別に入れ替える
              for (const old of seasons) await rpc("del_season", { id: old.id });
              for (const sn of d.seasons || []) {
                await rpc("ins_season", {
                  id: Number.isInteger(sn.id) ? sn.id : Date.now() + Math.floor(Math.random() * 1000),
                  name: sn.name, start_date: sn.start, end_date: sn.end || null, closed: !!sn.closed,
                });
              }
              setSeasonView(null);
              setPeriod("all");
              await loadAll(false);
              setEditId(null);
              setIoMsg({ ok: true, text: `${d.games.length}半荘分を読み込み、全員に共有しました。` });
            } catch (e) {
              setIoMsg({ ok: false, text: NET_ERR });
            }
          },
        });
      } catch (e) {
        setIoMsg({ ok: false, text: "このファイルは読み込めません。書き出したJSONファイルを選んでください。" });
      }
    };
    reader.onerror = () => setIoMsg({ ok: false, text: "ファイルを開けませんでした。" });
    reader.readAsText(file);
  };
  const playedCount = (id) => games.filter((g) => g.entries.some((e) => e.memberId === id)).length;

  const deleteMember = async (id) => {
    setErr("");
    try {
      await rpc("del_member", { id });
      setMembers((prev) => prev.filter((m) => m.id !== id));
      setGroups((prev) => prev.map((g) => ({ ...g, memberIds: g.memberIds.filter((x) => x !== id) })));
      setSeats(seats.map((s) => (s === id ? null : s)));
    } catch (e) { setErr(NET_ERR); }
  };

  // ===== グループ =====
  const toggleDraft = (id) => {
    if (groupDraft.includes(id)) setGroupDraft(groupDraft.filter((x) => x !== id));
    else if (groupDraft.length < 4) setGroupDraft([...groupDraft, id]);
  };

  const saveGroup = () => {
    const n = newGroupName.trim();
    if (!n) return setErr("グループ名を入力してください。");
    if (groupDraft.length !== 4) return setErr("メンバーを4人選んでください。");
    setErr("");
    const row = { id: Date.now(), name: n, memberIds: [...groupDraft] };
    rpc("ins_group", { id: row.id, name: row.name, member_ids: row.memberIds })
      .then(() => {
        setGroups((prev) => [...prev, row]);
        setNewGroupName("");
        setGroupDraft([]);
        setShowGroupForm(false);
      })
      .catch(() => setErr(NET_ERR));
  };

  // ===== 点数入力 =====
  const filledCount = scores.filter((s) => s.trim() !== "" && s.trim() !== "-" && Number.isFinite(Number(s))).length;
  const inputTotal = scores.reduce((a, b) => a + (Number(b) || 0), 0);
  const diff = inputTotal - TOTAL;

  // 3人ぶん入っていれば、残り1人は自動で決まる
  const setScore = (i, raw) => {
    const v = toHalf(raw);
    if (v !== "" && !/^-?\d*$/.test(v)) return;
    const s = [...scores];
    s[i] = v;
    setScores(s);
    // 自動で入れた値は、他の欄を打ち直したら破棄する
    if (autoFilled >= 0 && autoFilled !== i) {
      s[autoFilled] = "";
      setScores([...s]);
      setAutoFilled(-1);
    }
  };

  // 入力欄から離れたときに、末尾の00を補う（125 → 12500）。
  // すでに3桁を超える入力や、マイナスの符号だけの場合はそのまま。
  const expandScore = (v) => {
    const t = v.trim();
    if (t === "" || t === "-") return t;
    const neg = t.startsWith("-");
    const digits = neg ? t.slice(1) : t;
    if (digits === "" || digits.length > 3) return t;
    return (neg ? "-" : "") + digits + "00";
  };

  // 入力欄から離れたとき、00を補ってから4人目を確定させる（入力途中では計算しない）
  const handleBlur = (i) => {
    const s = [...scores];
    s[i] = expandScore(s[i]);
    if (autoFilled >= 0 && autoFilled !== i) { s[autoFilled] = ""; }
    setScores(s);
    setAutoFilled(-1);

    const filled = s.filter((x) => x.trim() !== "" && x.trim() !== "-" && Number.isFinite(Number(x))).length;
    if (filled !== 3) return;
    const idx = s.findIndex((x) => x.trim() === "" || x.trim() === "-" || !Number.isFinite(Number(x)));
    if (idx < 0) return;
    const val = TOTAL - s.reduce((a, x, k) => (k === idx ? a : a + (Number(x) || 0)), 0);
    s[idx] = String(val);
    setScores(s);
    setAutoFilled(idx);
  };

  // ===== 記録 =====
  const addGame = (dupOk = false) => {
    setErr("");
    if (seats.some((s) => s == null)) return setErr("4人のメンバーを選んでください。");
    if (new Set(seats).size !== 4) return setErr("同じメンバーが重複しています。");
    const nums = scores.map((s) => Number(s));
    if (scores.some((s) => s.trim() === "" || s.trim() === "-") || nums.some((n) => !Number.isFinite(n)))
      return setErr("4人分の点数を入力してください。");
    if (nums.reduce((a, b) => a + b, 0) !== TOTAL)
      return setErr(`点数の合計が ${TOTAL.toLocaleString()} になりません。`);

    const entries = buildEntries(seats, nums);

    // 同じ日に、同じ4人・同じ点数の記録がすでにないか調べる（二重登録の防止）
    const key = [...entries].map((e) => `${e.memberId}:${e.raw}`).sort().join("|");
    const dup = games.some(
      (g) => g.date === gameDate &&
        [...g.entries].map((e) => `${e.memberId}:${e.raw}`).sort().join("|") === key
    );
    if (dup && !dupOk) {
      setConfirmAsk({
        title: "同じ内容の半荘がすでにあります",
        body: [...entries].sort((a, b) => a.rank - b.rank)
          .map((e) => `${e.rank}位  ${memberName(e.memberId)}  ${e.raw.toLocaleString()}点`)
          .join("\n"),
        note: "他の人がすでに記録したのかもしれません。それでも登録しますか？",
        okLabel: "登録する",
        onOk: () => { setDupOk(true); setTimeout(() => addGame(true), 0); },
      });
      return;
    }

    const row = { id: Date.now(), date: gameDate, entries };
    rpc("ins_game", row)
      .then(() => {
        setGames((prev) => [...prev, row]);
        setScores(["", "", "", ""]);
        setAutoFilled(-1);
        setDupOk(false);
        setStep(1);
        setSelectedDay(gameDate);
        setTab("stats");
      })
      .catch(() => setErr(NET_ERR));
  };

  const removeGame = (id) => {
    rpc("del_game", { id })
      .then(() => setGames((prev) => prev.filter((g) => g.id !== id)))
      .catch(() => setErr(NET_ERR));
  };

  // ===== 集計 =====
  const statsFor = (id, gameList) => {
    const src = gameList || games;
    const rows = [];
    src.forEach((g) => {
      const e = g.entries.find((x) => x.memberId === id);
      if (e) rows.push({ ...e, date: g.date });
    });
    const n = rows.length;
    if (n === 0)
      return { n: 0, avgRank: 0, top: 0, last: 0, point: 0, avgPoint: 0, best: 0, worst: 0, ranks: [0, 0, 0, 0], rows: [] };
    const ranks = [0, 0, 0, 0];
    let sumRank = 0, sumPoint = 0;
    rows.forEach((r) => {
      ranks[r.rank - 1]++;
      sumRank += r.rank;
      sumPoint += r.point;
    });
    const pts = rows.map((r) => r.point);
    return {
      n,
      avgRank: sumRank / n,
      top: (ranks[0] / n) * 100,
      last: (ranks[3] / n) * 100,
      point: round1(sumPoint),
      avgPoint: round1(sumPoint / n),
      best: Math.max(...pts),
      worst: Math.min(...pts),
      ranks,
      rows,
    };
  };

  const days = useMemo(() => [...new Set(games.map((g) => g.date))].sort((a, b) => (a < b ? 1 : -1)), [games]);

  useEffect(() => {
    if (selectedDay == null || !days.includes(selectedDay)) setSelectedDay(days[0] || null);
  }, [days, selectedDay]);

  const dayGames = useMemo(
    () => (selectedDay ? games.filter((g) => g.date === selectedDay) : []),
    [games, selectedDay]
  );

  const dayMembers = useMemo(() => {
    const ids = [];
    dayGames.forEach((g) => g.entries.forEach((e) => { if (!ids.includes(e.memberId)) ids.push(e.memberId); }));
    return ids;
  }, [dayGames]);

  const dayStats = useMemo(() => {
    const map = {};
    dayMembers.forEach((id) => (map[id] = statsFor(id, dayGames)));
    return map;
  }, [dayMembers, dayGames]);

  // ===== 半荘の修正 =====
  const openEdit = (g) => {
    setEditGame(g);
    setEditDate(g.date);
    setEditScores(g.entries.map((e) => String(e.raw)));
    setErr("");
  };
  const saveEdit = () => {
    if (!editGame) return;
    const nums = editScores.map((v) => parseInt(String(v).replace(/[^\d-]/g, ""), 10));
    if (nums.some((n) => Number.isNaN(n))) { setErr("4人分の点数を入力してください。"); return; }
    if (nums.reduce((a, b) => a + b, 0) !== TOTAL) { setErr(`合計が${TOTAL.toLocaleString()}点になっていません。`); return; }
    const ids = editGame.entries.map((e) => e.memberId);
    const entries = buildEntries(ids, nums);
    const row = { id: editGame.id, date: editDate, entries };
    rpc("upd_game", row)
      .then(() => {
        setGames((prev) => prev.map((g) => (g.id === row.id ? row : g)));
        setEditGame(null);
        setErr("");
      })
      .catch(() => setErr(NET_ERR));
  };

  // ===== シーズン =====
  const saveSeason = () => {
    const n = seasonDraft.name.trim();
    if (!n) { setErr("シーズン名を入力してください。"); return; }
    if (!seasonDraft.start) { setErr("開始日を入力してください。"); return; }
    const row = { id: Date.now(), name: n, start_date: seasonDraft.start, end_date: seasonDraft.end || null, closed: false };
    rpc("ins_season", row)
      .then(() => {
        setSeasons((prev) => [...prev, { id: row.id, name: n, start: row.start_date, end: row.end_date, closed: false }]);
        setSeasonDraft({ name: "", start: "", end: "" });
        setShowSeasonForm(false);
        setErr("");
      })
      .catch(() => setErr(NET_ERR));
  };
  const closeSeason = (sn) => {
    const row = { id: sn.id, name: sn.name, start_date: sn.start, end_date: sn.end || todayISO(), closed: !sn.closed };
    rpc("upd_season", row)
      .then(() => setSeasons((prev) => prev.map((x) => (x.id === sn.id
        ? { ...x, end: row.end_date, closed: row.closed } : x))))
      .catch(() => setErr(NET_ERR));
  };
  const removeSeason = (id) => {
    rpc("del_season", { id })
      .then(() => {
        setSeasons((prev) => prev.filter((x) => x.id !== id));
        if (period === `s${id}`) setPeriod("all");
        if (seasonView === id) setSeasonView(null);
      })
      .catch(() => setErr(NET_ERR));
  };

  // ===== シーズンの表彰 =====
  // 副賞は優勝者を除いて選ぶ（強い人が総取りしないように）
  const awardsOf = (sn) => {
    const list = games
      .filter((g) => g.date >= sn.start && (!sn.end || g.date <= sn.end))
      .sort((a, b) => (a.date === b.date ? a.id - b.id : a.date < b.date ? -1 : 1));
    if (list.length === 0) return null;
    const ids = [...new Set(list.flatMap((g) => g.entries.map((e) => e.memberId)))];
    const st = {};
    ids.forEach((id) => {
      const rows = list.flatMap((g) => g.entries.filter((e) => e.memberId === id));
      const n = rows.length;
      if (!n) return;
      const pts = rows.map((r) => r.point);
      const ranks = [0, 0, 0, 0];
      rows.forEach((r) => ranks[r.rank - 1]++);
      const mean = pts.reduce((a, b) => a + b, 0) / n;
      st[id] = {
        n,
        total: round1(pts.reduce((a, b) => a + b, 0)),
        avgRank: rows.reduce((a, r) => a + r.rank, 0) / n,
        top: (ranks[0] / n) * 100,
        last: (ranks[3] / n) * 100,
        bestRaw: Math.max(...rows.map((r) => r.raw)),
        sd: Math.sqrt(pts.reduce((a, x) => a + (x - mean) ** 2, 0) / n),
      };
    });
    const valid = ids.filter((id) => st[id]);
    if (valid.length === 0) return null;
    const champ = [...valid].sort((a, b) => st[b].total - st[a].total)[0];
    const used = new Set([champ]);
    const take = (f, desc) => {
      const pool = valid.filter((x) => !used.has(x));
      const src = pool.length ? pool : valid.filter((x) => x !== champ);
      if (!src.length) return null;
      const pick = [...src].sort((a, b) => (desc ? f(st[b]) - f(st[a]) : f(st[a]) - f(st[b])))[0];
      used.add(pick);
      return pick;
    };
    const standings = [...valid].sort((a, b) => st[b].total - st[a].total);
    return {
      n: list.length,
      st,
      champ,
      standings,
      bestScore: take((x) => x.bestRaw, true),
      lastAvoid: take((x) => x.last, false),
      stable: take((x) => x.sd, false),
    };
  };

  const openSeasonAward = useMemo(() => seasons.find((x) => x.id === seasonView) || null, [seasons, seasonView]);
  const seasonAward = useMemo(() => (openSeasonAward ? awardsOf(openSeasonAward) : null), [openSeasonAward, games]);
  const seasonSummaries = useMemo(() => {
    const m = {};
    seasons.forEach((sn) => { m[sn.id] = awardsOf(sn); });
    return m;
  }, [seasons, games]);

  // ===== 期間の絞り込み =====
  const periodOptions = useMemo(() => {
    const opts = [{ key: "all", label: "全期間" }, { key: "month", label: "今月" }, { key: "year", label: "今年" }, { key: "last10", label: "直近10" }];
    seasons.forEach((sn) => opts.push({ key: `s${sn.id}`, label: sn.name, season: sn }));
    return opts;
  }, [seasons]);

  const inPeriod = (list) => {
    if (period === "all") return list;
    if (period === "last10") return list.slice(-10);
    const now = todayISO();
    if (period === "month") {
      const ym = now.slice(0, 7);
      return list.filter((g) => g.date.slice(0, 7) === ym);
    }
    if (period === "year") {
      const y = now.slice(0, 4);
      return list.filter((g) => g.date.slice(0, 4) === y);
    }
    if (period.startsWith("s")) {
      const sn = seasons.find((x) => `s${x.id}` === period);
      if (!sn) return list;
      return list.filter((g) => g.date >= sn.start && (!sn.end || g.date <= sn.end));
    }
    return list;
  };

  // 累計タブ：グループで絞り込む（その4人だけで打った半荘のみ）＋期間で絞り込む
  const totalGames = useMemo(() => {
    let base = games;
    if (totalGroupId != null) {
      const g = groups.find((x) => x.id === totalGroupId);
      if (g) {
        const key = [...g.memberIds].sort().join(",");
        base = games.filter((gm) => [...gm.entries.map((e) => e.memberId)].sort().join(",") === key);
      }
    }
    const sorted = [...base].sort((a, b) => (a.date === b.date ? a.id - b.id : a.date < b.date ? -1 : 1));
    return inPeriod(sorted);
  }, [games, groups, totalGroupId, period, seasons]);

  const totalStats = useMemo(() => {
    const map = {};
    members.forEach((m) => (map[m.id] = statsFor(m.id, totalGames)));
    return map;
  }, [members, totalGames]);

  const totalDays = useMemo(() => [...new Set(totalGames.map((g) => g.date))].length, [totalGames]);

  // 並び替えの基準。avgRank だけは小さいほど良いので昇順
  const SORTS = [
    { key: "point", label: "合計pt", get: (x) => x.point, asc: false },
    { key: "avgRank", label: "平均順位", get: (x) => x.avgRank, asc: true },
    { key: "top", label: "トップ率", get: (x) => x.top, asc: false },
    { key: "avgPoint", label: "平均pt", get: (x) => x.avgPoint, asc: false },
    { key: "avoid", label: "ラス回避率", get: (x) => 100 - x.last, asc: false },
  ];

  // 並び替えの基準ごとに、4人の平均を境にして良し悪しの色を決める
  const sortAvg = useMemo(() => {
    const list = members.filter((m) => totalStats[m.id]?.n > 0).map((m) => totalStats[m.id]);
    if (list.length === 0) return null;
    const mean = (f) => list.reduce((a, x) => a + f(x), 0) / list.length;
    return {
      point: mean((x) => x.point),
      avgPoint: mean((x) => x.avgPoint),
      avgRank: mean((x) => x.avgRank),
      top: mean((x) => x.top),
      avoid: mean((x) => 100 - x.last),
    };
  }, [members, totalStats]);

  // 選んだ基準での「良い側か」を返す（平均順位だけは小さいほど良い）
  const isGood = (st) => {
    if (!sortAvg) return true;
    if (sortKey === "point") return st.point >= 0;
    if (sortKey === "avgPoint") return st.avgPoint >= 0;
    if (sortKey === "avgRank") return st.avgRank <= sortAvg.avgRank;
    if (sortKey === "top") return st.top >= sortAvg.top;
    return 100 - st.last >= sortAvg.avoid;
  };

  const ranked = useMemo(() => {
    const sorter = SORTS.find((x) => x.key === sortKey) || SORTS[0];
    return members
      .filter((m) => totalStats[m.id]?.n > 0)
      .sort((a, b) => {
        const va = sorter.get(totalStats[a.id]);
        const vb = sorter.get(totalStats[b.id]);
        if (va === vb) return totalStats[b.id].point - totalStats[a.id].point;
        return sorter.asc ? va - vb : vb - va;
      });
  }, [members, totalStats, sortKey]);

  // 表彰用の最高記録
  const highlights = useMemo(() => {
    if (ranked.length === 0) return null;
    let bestGame = null, worstGame = null;
    totalGames.forEach((g) =>
      g.entries.forEach((e) => {
        if (!bestGame || e.raw > bestGame.raw) bestGame = { ...e, date: g.date };
        if (!worstGame || e.raw < worstGame.raw) worstGame = { ...e, date: g.date };
      })
    );
    const byTop = [...ranked].sort((a, b) => totalStats[b.id].top - totalStats[a.id].top)[0];
    const byRank = [...ranked].sort((a, b) => totalStats[a.id].avgRank - totalStats[b.id].avgRank)[0];
    return { bestGame, worstGame, byTop, byRank };
  }, [ranked, totalGames, totalStats]);

  // ===== 記録集（歴代ベスト）=====
  const records = useMemo(() => {
    if (totalGames.length === 0) return null;

    // 歴代最高得点・最低得点 トップ5
    const allEntries = [];
    totalGames.forEach((g) => g.entries.forEach((e) => allEntries.push({ ...e, date: g.date })));
    const topRaw = [...allEntries].sort((a, b) => b.raw - a.raw).slice(0, 5);
    const lowRaw = [...allEntries].sort((a, b) => a.raw - b.raw).slice(0, 5);

    // 1日の最高収支（メンバー×日付でptを合計）
    const dayMap = {};
    totalGames.forEach((g) =>
      g.entries.forEach((e) => {
        const k = `${g.date}__${e.memberId}`;
        dayMap[k] = (dayMap[k] || 0) + e.point;
      })
    );
    const dayList = Object.entries(dayMap).map(([k, v]) => {
      const [date, mid] = k.split("__");
      return { date, memberId: Number(mid), point: round1(v) };
    });
    const bestDay = [...dayList].sort((a, b) => b.point - a.point)[0] || null;
    const worstDay = [...dayList].sort((a, b) => a.point - b.point)[0] || null;

    // 連続記録（時系列で各メンバーを追う）
    const seq = {};
    totalGames.forEach((g) =>
      g.entries.forEach((e) => {
        if (!seq[e.memberId]) seq[e.memberId] = [];
        seq[e.memberId].push(e.rank);
      })
    );
    const streak = (arr, ok) => {
      let best = 0, cur = 0;
      arr.forEach((r) => { cur = ok(r) ? cur + 1 : 0; if (cur > best) best = cur; });
      return best;
    };
    const nowStreak = (arr, ok) => {
      let cur = 0;
      for (let i = arr.length - 1; i >= 0; i--) { if (ok(arr[i])) cur++; else break; }
      return cur;
    };
    const streaks = Object.entries(seq).map(([mid, arr]) => ({
      memberId: Number(mid),
      topRun: streak(arr, (r) => r === 1),
      renRun: streak(arr, (r) => r <= 2),
      noLastRun: streak(arr, (r) => r !== 4),
      nowTop: nowStreak(arr, (r) => r === 1),
      nowRen: nowStreak(arr, (r) => r <= 2),
      nowNoLast: nowStreak(arr, (r) => r !== 4),
    }));
    const pick = (key) => [...streaks].sort((a, b) => b[key] - a[key])[0] || null;

    // 最大の逆転劇：その日の途中でマイナスに沈んだあと、プラスで終えた幅
    let comeback = null;
    const days = [...new Set(totalGames.map((g) => g.date))];
    days.forEach((d) => {
      const dg = totalGames.filter((g) => g.date === d);
      if (dg.length < 2) return;
      const acc = {}, low = {};
      dg.forEach((g) =>
        g.entries.forEach((e) => {
          acc[e.memberId] = (acc[e.memberId] || 0) + e.point;
          if (low[e.memberId] == null || acc[e.memberId] < low[e.memberId]) low[e.memberId] = acc[e.memberId];
        })
      );
      Object.keys(acc).forEach((mid) => {
        // どん底がマイナスで、最終的にプラスで終えた場合だけ「逆転」と数える
        if (low[mid] >= 0 || acc[mid] <= 0) return;
        const gain = round1(acc[mid] - low[mid]);
        if (!comeback || gain > comeback.gain) {
          comeback = { memberId: Number(mid), date: d, gain, from: round1(low[mid]), final: round1(acc[mid]) };
        }
      });
    });

    return { topRaw, lowRaw, bestDay, worstDay, streaks, pick, comeback };
  }, [totalGames]);

  // ===== グラフ =====
  const Chart = ({ ids, gameList }) => {
    const src = gameList || games;
    const lines = ids.map((id) => {
      let acc = 0;
      const pts = [{ i: 0, v: 0 }];
      src.forEach((g, gi) => {
        const e = g.entries.find((x) => x.memberId === id);
        if (e) {
          acc += e.point;
          pts.push({ i: gi + 1, v: round1(acc) });
        }
      });
      return { id, pts, total: round1(acc) };
    });
    const all = lines.flatMap((l) => l.pts.map((p) => p.v));
    if (all.length <= ids.length) return <p style={S.empty}>記録が増えるとここに推移が表示されます。</p>;

    const sorted = [...lines].sort((a, b) => b.total - a.total);
    const max = Math.max(...all, 10);
    const min = Math.min(...all, -10);
    const single = ids.length === 1;
    const W = 340, H = 205, L = 24, R = single ? 12 : 92, V = 18;
    const xMax = Math.max(src.length, 1);
    const x = (i) => L + (i * (W - L - R)) / xMax;
    const y = (v) => H - V - ((v - min) / (max - min || 1)) * (H - V * 2);

    // 案1: 目盛り線。0を必ず含め、上下にキリのよい線を数本引く
    const rng = max - min;
    const rawStep = rng / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
    const norm = rawStep / mag;
    const niceStep = (norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10) * mag;
    const ticks = [];
    for (let t = Math.ceil(min / niceStep) * niceStep; t <= max; t += niceStep) {
      ticks.push(Math.round(t * 10) / 10);
    }
    if (!ticks.includes(0) && min < 0 && max > 0) ticks.push(0);

    // 終点ラベルの縦位置を決める。ey=線の実際の終点、yv=牌の位置
    // 重なったところだけずらし、離れている牌は終点の真横に留める
    const ends = sorted.map((l) => {
      const ey = y(l.pts[l.pts.length - 1].v);
      return { id: l.id, total: l.total, ey, yv: ey };
    });
    const LABEL_H = 20;
    for (let i = 1; i < ends.length; i++) {
      if (ends[i].yv - ends[i - 1].yv < LABEL_H) ends[i].yv = ends[i - 1].yv + LABEL_H;
    }
    // 下端からはみ出す場合は、押し出された牌の連なりだけを下から順に持ち上げる
    if (ends.length) {
      const last = ends.length - 1;
      if (ends[last].yv > H - 10) ends[last].yv = H - 10;
      for (let i = last - 1; i >= 0; i--) {
        if (ends[i + 1].yv - ends[i].yv < LABEL_H) ends[i].yv = ends[i + 1].yv - LABEL_H;
        else break;
      }
    }

    const uid = single ? `d${ids[0]}` : "t";

    return (
      <div style={S.chartArea}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block", overflow: "visible" }}>
          <defs>
            <filter id={`soft-${uid}`} x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" />
            </filter>
            <linearGradient id={`hai-${uid}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#FFFFFF" />
              <stop offset="100%" stopColor="#EDE6D4" />
            </linearGradient>
            <filter id={`hs-${uid}`} x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" floodColor="#3C321E" floodOpacity="0.25" />
            </filter>
          </defs>

          {/* 案1: 罫線。0は金、その他は極薄 */}
          {ticks.map((t, k) => {
            const zero = t === 0;
            return (
              <g key={k}>
                <line x1={L} y1={y(t)} x2={W - R} y2={y(t)}
                  stroke={zero ? "#D8B76A" : "rgba(216,183,106,.20)"} strokeWidth={zero ? 1.2 : 1}
                  strokeDasharray={zero ? "none" : "1 4"} opacity={zero ? 0.7 : 1} />
                <text x={L - 5} y={y(t) + 3} fontSize="8" textAnchor="end"
                  fill={zero ? "#D8B76A" : "#8FB0A2"} fontFamily="ui-monospace, monospace">
                  {t}
                </text>
              </g>
            );
          })}

          {/* 折れ線 */}
          {lines.map((l) => {
            const pts = l.pts.map((p) => [x(p.i), y(p.v)]);
            let len = 0;
            for (let k = 1; k < pts.length; k++) {
              len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
            }
            return (
              <g key={l.id}>
                <polyline className="chart-line" style={{ "--len": `${len || 1}` }}
                  fill="none" stroke={memberColor(l.id)} strokeWidth="2"
                  strokeLinejoin="round" strokeLinecap="round"
                  points={pts.map((p) => `${p[0]},${p[1]}`).join(" ")} />
                {/* 半荘が増えて点が密になったら、点は省いて線だけにする */}
                {(W - L - R) / Math.max(src.length, 1) >= 3 &&
                  l.pts.map((p, k) => <circle key={k} cx={x(p.i)} cy={y(p.v)} r="1.8" fill={memberColor(l.id)} />)}
              </g>
            );
          })}

          {/* 案4: 最新地点を光らせる */}
          {lines.map((l) => {
            const last = l.pts[l.pts.length - 1];
            return (
              <g key={l.id}>
                <circle cx={x(last.i)} cy={y(last.v)} r="5" fill={memberColor(l.id)}
                  opacity="0.35" filter={`url(#soft-${uid})`} />
                <circle cx={x(last.i)} cy={y(last.v)} r={single ? 3.4 : 3}
                  fill={memberColor(l.id)} stroke={T.paper} strokeWidth="1.4" />
              </g>
            );
          })}

          {/* 終点ラベル：象牙の牌に名前を刻む */}
          {!single && ends.map((e) => {
            const nm = memberName(e.id);
            const val = signed(e.total);
            // 全角と半角で文字幅が違うため、区別して札の幅を計算する
            const fw = [...nm].filter((ch) => ch.charCodeAt(0) > 255).length;
            const hw = nm.length - fw;
            const tw = 9 + fw * 10 + hw * 5.5 + 4 + String(val).length * 5.6 + 7;
            return (
              <g key={e.id}>
                <line x1={W - R - 2} y1={e.ey} x2={W - R + 3} y2={e.yv} stroke={memberColor(e.id)} strokeWidth="1.4" />
                <rect x={W - R + 3} y={e.yv - 9} width={tw} height="18" rx="4.5"
                  fill={`url(#hai-${uid})`} filter={`url(#hs-${uid})`} />
                <rect x={W - R + 3} y={e.yv - 9} width="3.5" height="18" rx="1.7" fill={memberColor(e.id)} />
                <text x={W - R + 12} y={e.yv + 3.4} fontSize="9.5" fontWeight="700" fill={INK}>
                  {nm}
                  <tspan dx="4" fontSize="9" fontWeight="400" fill={e.total >= 0 ? PLUS : MINUS}
                    fontFamily="ui-monospace, monospace">{val}</tspan>
                </text>
              </g>
            );
          })}
        </svg>
      </div>
    );
  };

  if (loading) return <div style={S.wrap}><p style={S.empty}>読み込み中…</p></div>;

  if (needPass) return (
    <div style={S.page}>
      <div style={S.wrap} className="safe">
        <div style={{ height: 48 }} />
        <div style={S.card} className="tabview card-tex">
          <div style={{ textAlign: "center", padding: "8px 0 4px" }}>
            <span style={{ ...S.monogram, display: "inline-flex", margin: "0 auto" }}>
              <span style={S.monogramTile}>雀</span>
            </span>
            <h1 style={{ fontSize: 20, fontWeight: 700, margin: "14px 0 4px", color: "#F0E6CC", letterSpacing: "0.10em", fontFamily: MIN }}>
              麻雀成績ログ
            </h1>
            <p style={{ ...S.hint, marginBottom: 20 }}>メンバー共有の記録帳です。合言葉を入力してください。</p>
          </div>
          <input
            type="password"
            value={passInput}
            placeholder="合言葉"
            style={{ ...S.memberInputOn, width: "100%", boxSizing: "border-box", padding: "13px 14px", fontSize: 16, textAlign: "center" }}
            onChange={(e) => setPassInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submitPass()}
          />
          {passErr && <p style={S.err}>{passErr}</p>}
          <button style={S.primary} className="press" onClick={submitPass}>ひらく</button>
          <p style={{ ...S.hint, marginTop: 14, marginBottom: 0 }}>
            合言葉は一度入力すれば、この端末に記憶されます。
          </p>
        </div>
      </div>
    </div>
  );

  if (loadErr) return (
    <div style={S.page}>
      <div style={S.wrap}>
        <div style={S.card} className="card-tex">
          <p style={{ ...S.empty, marginBottom: 12 }}>
            記録を読み込めませんでした。電波の届く場所でもう一度お試しください。
          </p>
          <button style={S.primary} onClick={async () => { setLoading(true); await loadAll(false); setLoading(false); }}>
            再読み込み
          </button>
        </div>
      </div>
    </div>
  );

  // ===== 個人ページ =====
  if (detailId != null) {
    // 累計タブで期間を絞っているときは、個人ページも同じ期間で見せる
    const st = statsFor(detailId, totalGames);
    const periodLabel = period === "all" ? null : periodOptions.find((o) => o.key === period)?.label;
    const c = memberColor(detailId);
    return (
      <div style={S.wrap}>
        <button style={S.back} onClick={() => setDetailId(null)}>← 戻る</button>
        <div style={{ ...S.card, borderTop: `3px solid ${c}` }} className="tabview card-tex">
          <h1 style={{ ...S.detailName, color: c, display: "flex", alignItems: "center", gap: 10, justifyContent: "center" }}>
            <Avatar id={detailId} size={38} />
            {memberName(detailId)}
            {periodLabel && <span style={S.periodTag}>{periodLabel}</span>}
          </h1>
          {st.n === 0 ? (
            <p style={S.empty}>
              {periodLabel ? `${periodLabel}の記録はありません。` : "まだ対戦記録がありません。"}
            </p>
          ) : (
            <>
              <div style={S.bigPt}>
                <span style={S.bigPtLabel}>通算</span>
                <b style={{ ...S.bigPtValue, color: st.point >= 0 ? PLUS_D : MINUS_D }}>{signed(st.point)}</b>
                <span style={S.bigPtUnit}>pt / {st.n}半荘</span>
              </div>
              <div style={S.kpis}>
                <Kpi label="平均順位" value={st.avgRank.toFixed(2)} />
                <Kpi label="平均pt" value={signed(st.avgPoint)} color={st.avgPoint >= 0 ? PLUS_D : MINUS_D} />
                <Kpi label="トップ率" value={`${st.top.toFixed(0)}%`} />
                <Kpi label="ラス率" value={`${st.last.toFixed(0)}%`} />
              </div>
              <div style={S.section}>着順の分布</div>
              {st.ranks.map((cnt, i) => (
                <div key={i} style={S.rankBarRow}>
                  <span style={{ ...S.rankBarLabel, color: RANK_INK[i] }}>{i + 1}位</span>
                  <div style={S.rankBarTrack}>
                    <div style={{ ...S.rankBarFill, width: `${(cnt / st.n) * 100}%`, background: RANK_INK[i] }} />
                  </div>
                  <span style={S.rankBarVal}>{cnt}回 · {((cnt / st.n) * 100).toFixed(0)}%</span>
                </div>
              ))}
              <p style={S.hint}>最高 {signed(st.best)}pt ／ 最低 {signed(st.worst)}pt</p>

              <div style={S.section}>通算ポイントの推移</div>
              <Chart ids={[detailId]} gameList={totalGames} />
            </>
          )}
        </div>
      </div>
    );
  }

  const canSubmit = filledCount === 4 && diff === 0 && !seats.some((s) => s == null);

  return (
    <div style={S.page}>
      <div style={S.wrap} className="safe">
      <header style={S.header}>
        <div style={S.headerTop}>
          <div style={S.brandRow}>
            <span style={S.monogram}>
              <span style={S.monogramTile}>雀</span>
            </span>
            <h1 style={S.h1}>麻雀成績ログ</h1>
          </div>
          <button style={S.ruleBadge} onClick={() => setShowRules(true)}>
            <span style={S.ruleBadgeDot} />
            Mリーグルール
          </button>
        </div>
        <div style={S.headerRule}>
          <span style={S.rulePill}>25000持ち</span>
          <span style={S.rulePill}>30000返し</span>
          <span style={S.ruleDivide} />
          {[["1位", 50], ["2位", 10], ["3位", -10], ["4位", -30]].map(([l, v], i) => (
            <span key={l} style={S.ruleRank}>
              <span style={S.ruleRankLabel}>{l}</span>
              <b style={{ ...S.ruleRankVal, color: RANK_TILE[i] }}>{v > 0 ? `+${v}` : v}</b>
            </span>
          ))}
        </div>
      </header>

      <nav style={S.tabs}>
        {[["input", "入力"], ["stats", "成績"], ["total", "累計"], ["members", "メンバー"]].map(([k, l]) => (
          <button key={k} onClick={() => { setTab(k); setErr(""); }}
            className="press" style={{ ...S.tab, ...(tab === k ? S.tabOn : {}) }}>{l}</button>
        ))}
      </nav>

      {DEV_MODE && (
        <p style={{ margin: "0 0 12px", fontSize: 11, textAlign: "center", color: "rgba(255,255,255,.72)" }}>
          プレビュー版 — 動作確認用のサンプル記録です。閉じると元に戻ります
        </p>
      )}

      {/* ===== 入力 ===== */}
      {tab === "input" && (
        <div style={S.card} className="tabview card-tex">
          {members.length < 4 ? (
            <>
              <p style={S.empty}>先にメンバーを4人以上登録してください。</p>
              <button style={S.primary} onClick={() => setTab("members")}>メンバーを登録する</button>
            </>
          ) : (
            <>
              {/* 進捗 */}
              <div style={S.stepBar}>
                {[["メンバー", 1], ["点数", 2]].map(([label, n]) => (
                  <div key={n} style={{
                    ...S.stepChip,
                    ...(step === n ? S.stepChipOn : step > n ? S.stepChipDone : {}),
                  }}>
                    <span style={S.stepNo}>STEP {n}</span>
                    {label}
                  </div>
                ))}
              </div>

              {/* ========== STEP 1: メンバー ========== */}
              {step === 1 && (
                <>
                  <div style={S.dateRow}>
                    <span style={S.miniLabel}>対局日</span>
                    <input style={S.dateInput} type="date" value={gameDate}
                      onChange={(e) => setGameDate(e.target.value)} />
                  </div>

                  {groups.length > 0 && (
                    <>
                      <div style={S.miniLabel}>グループから選ぶ</div>
                      {groups.map((g) => {
                        const on = g.memberIds.every((id) => seats.includes(id)) && seats.filter(Boolean).length === 4;
                        return (
                          <button key={g.id} style={{ ...S.groupPick, ...(on ? S.groupPickOn : {}) }}
                            onClick={() => { setSeats([...g.memberIds]); setErr(""); }}>
                            {g.name}
                            <span style={S.groupPickSub}>{g.memberIds.map(memberName).join("・")}</span>
                          </button>
                        );
                      })}
                      <div style={S.orLine}>または 1人ずつ選ぶ</div>
                    </>
                  )}
                  {groups.length === 0 && <div style={S.miniLabel}>4人を選ぶ</div>}

                  <div style={S.memberGrid}>
                    {members.map((m) => {
                      const idx = seats.indexOf(m.id);
                      const on = idx >= 0;
                      return (
                        <button key={m.id} style={{ ...S.memberPick, ...(on ? S.memberPickOn : {}) }}
                          onClick={() => {
                            const next = [...seats];
                            if (on) next[idx] = null;
                            else {
                              const slot = next.indexOf(null);
                              if (slot === -1) return;
                              next[slot] = m.id;
                            }
                            setSeats(next);
                            setErr("");
                          }}>
                          {m.name}
                          {on && <span style={S.memberPickNo}>{idx + 1}</span>}
                        </button>
                      );
                    })}
                  </div>

                  <button className="press"
                    style={{ ...S.primary, ...(seats.filter((x) => x != null).length === 4 ? {} : S.primaryOff) }}
                    onClick={() => { if (seats.every((x) => x != null)) { setStep(2); setErr(""); } }}>
                    点数入力へ　›
                  </button>
                </>
              )}

              {/* ========== STEP 2: 点数 ========== */}
              {step === 2 && (
                <>
                  <div style={S.miniLabel}>終局時の点数を入れる</div>
                  {seats.map((id, i) => {
                    const isNeg = scores[i].trim().startsWith("-");
                    // 3桁以下の数字だけ入力中は「00」を薄く添えて見せる（4桁以上や空欄では出さない）
                    const digits = (isNeg ? scores[i].slice(1) : scores[i]).trim();
                    const showSuffix = digits !== "" && digits.length <= 3 && /^\d+$/.test(digits);
                    return (
                      <div key={id} style={S.scoreRow}>
                        <Avatar id={id} size={34} />
                        <span style={{ ...S.scoreName, color: memberColor(id) }}>{memberName(id)}</span>
                        <span style={S.scoreFieldWrap}>
                          <input
                            style={{
                              ...S.scoreInput,
                              color: isNeg ? MINUS : T.inkDark,
                              ...(i === autoFilled ? S.scoreInputAuto : {}),
                            }}
                            type="text" inputMode="numeric" pattern="-?[0-9]*"
                            value={scores[i]} placeholder="250"
                            onChange={(e) => setScore(i, e.target.value)}
                            onBlur={() => handleBlur(i)}
                            onKeyDown={(e) => e.key === "Enter" && e.currentTarget.blur()} />
                          {showSuffix && <span style={S.scoreSuffix}>00</span>}
                        </span>
                        <button
                          style={{ ...S.scoreSign, ...(isNeg ? S.scoreSignOn : {}) }}
                          title="マイナスに切り替え（もう一度押すとプラスに戻る）"
                          onClick={() => {
                            const t = scores[i].trim();
                            setScore(i, t === "" || t === "-" ? "-" : t.startsWith("-") ? t.slice(1) : "-" + t);
                          }}>−</button>
                      </div>
                    );
                  })}

                  <div style={{ ...S.totalBar, background: filledCount === 0 ? "rgba(4,22,16,.45)" : diff === 0 ? "rgba(30,111,69,.22)" : "rgba(176,58,46,.20)" }}>
                    <span style={S.totalLabel}>合計</span>
                    <span style={S.totalNums}>
                      <b style={{ color: diff === 0 && filledCount > 0 ? PLUS_D : "#F0E6CC" }}>{inputTotal.toLocaleString()}</b>
                      <span style={{ color: T.faint }}> / {TOTAL.toLocaleString()}</span>
                    </span>
                    {filledCount > 0 && (
                      <span style={{ ...S.totalDiff, color: diff === 0 ? PLUS_D : MINUS_D }}>
                        {diff === 0 ? "✓" : `${diff > 0 ? "+" : ""}${diff.toLocaleString()}`}
                      </span>
                    )}
                  </div>

                  <p style={S.hint}>3人ぶん入れて欄の外をタップすると、残り1人が自動で入ります。</p>
                  {err && <p style={S.err}>{err}</p>}
                  <div style={S.stepBtnRow}>
                    <button style={S.stepBack} onClick={() => setStep(1)}>‹ 戻る</button>
                    <button className="press" style={{ ...S.primary, flex: 2, marginTop: 0, ...(canSubmit ? {} : S.primaryOff) }}
                      onClick={() => addGame()}>記録する</button>
                  </div>
                </>
              )}
            </>
          )}
        </div>
      )}

      {/* ===== 成績 ===== */}
      {tab === "stats" && (
        <div style={S.card} className="tabview card-tex">
          {days.length === 0 ? (
            <p style={S.empty}>まだ記録がありません。「入力」から始めてください。</p>
          ) : (
            <>
              <div style={S.scrollRow}>
                {days.map((d) => (
                  <button key={d} onClick={() => setSelectedDay(d)}
                    style={{ ...S.chip, ...(selectedDay === d ? S.chipOn : {}) }}>
                    <span style={S.chipDay}>{formatDay(d)}</span>
                    <span style={S.chipSub}>{games.filter((g) => g.date === d).length}半荘</span>
                  </button>
                ))}
              </div>

              <div style={S.tableScroll}>
                <table style={S.gTable}>
                  <thead>
                    <tr>
                      <th style={{ ...S.gTh, ...S.stickyHead }}>#</th>
                      {dayMembers.map((id) => (
                        <th key={id} style={S.gTh}>
                          <span style={S.headCell}>
                            <span style={{ ...S.headRing, background: `linear-gradient(150deg, ${memberColor(id)}, rgba(0,0,0,.25))` }}>
                              <Avatar id={id} size={34} />
                            </span>
                            <span style={{ ...S.headName, color: memberColor(id) }}>{memberName(id)}</span>
                          </span>
                        </th>
                      ))}
                      <th style={{ ...S.gTh, width: 52 }} />
                    </tr>
                  </thead>
                  <tbody>
                    {dayGames.map((g, gi) => (
                      <tr key={g.id}>
                        <td style={{ ...S.gTd, ...S.sticky }}>{gi + 1}</td>
                        {dayMembers.map((id) => {
                          const e = g.entries.find((x) => x.memberId === id);
                          if (!e) return <td key={id} style={{ ...S.gTd, color: "#DDD9D2" }}>·</td>;
                          return (
                            <td key={id} style={{
                              ...S.gTd,
                              ...(e.rank === 1 ? S.cellWin : { background: RANK_BG[e.rank - 1] }),
                            }}>
                              <span style={{ ...S.rankRibbon, ...RANK_RIBBON[e.rank - 1] }}>
                                {e.rank === 1 && "♛ "}{e.rank}位
                              </span>
                              <span style={{ ...S.cellPt, color: e.point >= 0 ? PLUS : MINUS }}>{signed(e.point)}</span>
                              <span style={{ ...S.cellRule, ...(e.rank === 1 ? S.cellRuleWin : {}) }} />
                              <span style={{ ...S.cellRaw, color: e.raw < 0 ? MINUS : "#5A5750" }}>
                                {e.raw.toLocaleString()}<span style={S.cellUnit}> 点</span>
                              </span>
                            </td>
                          );
                        })}
                        <td style={{ ...S.gTd, padding: "6px 4px" }}>
                          <div style={S.gActCol}>
                            <button style={S.gActEdit} onClick={() => openEdit(g)}>修正</button>
                            <button style={S.gActDel}
                              onClick={() => setConfirmAsk({
                                title: `${gi + 1}半荘目を削除しますか？`,
                                body: [...g.entries].sort((a, b) => a.rank - b.rank)
                                  .map((e) => `${e.rank}位  ${memberName(e.memberId)}  ${e.raw.toLocaleString()}点  ${signed(e.point)}`)
                                  .join("\n"),
                                note: "合計ptが再計算されます。",
                                onOk: () => removeGame(g.id),
                              })}>削除</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td style={{ ...S.gFoot, ...S.stickyFoot, ...S.footLabel }}>合計</td>
                      {dayMembers.map((id) => {
                        const st = dayStats[id];
                        return (
                          <td key={id} style={{ ...S.gFoot, ...S.footTotal, color: st.point >= 0 ? PLUS : MINUS }}>
                            {signed(st.point)}
                          </td>
                        );
                      })}
                      <td style={S.gFoot} />
                    </tr>
                    <tr>
                      <td style={{ ...S.gFoot, ...S.stickyFoot, ...S.footLabel }}>平均</td>
                      {dayMembers.map((id) => (
                        <td key={id} style={{ ...S.gFoot, color: "#5A5750" }}>{dayStats[id].avgRank.toFixed(2)}</td>
                      ))}
                      <td style={S.gFoot} />
                    </tr>
                    <tr>
                      <td style={{ ...S.gFoot, ...S.stickyFoot, ...S.footLabel }}>着順</td>
                      {dayMembers.map((id) => (
                        <td key={id} style={{ ...S.gFoot, fontSize: 12 }}>
                          {dayStats[id].ranks.map((c, i) => (
                            <span key={i} style={{ color: c > 0 ? RANK_INK[i] : "#D5D2CB" }}>
                              {c}{i < 3 && <span style={{ color: "#DDD9D2" }}>·</span>}
                            </span>
                          ))}
                        </td>
                      ))}
                      <td style={S.gFoot} />
                    </tr>
                  </tfoot>
                </table>
              </div>
              <p style={S.hint}>セルは 着順 / pt / 点数。背景色は着順に対応しています。</p>
              <div style={S.section}>この日のポイント推移</div>
              <Chart ids={dayMembers} gameList={dayGames} />
            </>
          )}
        </div>
      )}

      {/* ===== 累計 ===== */}
      {tab === "total" && (
        <div style={S.card} className="tabview card-tex">
          {groups.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={S.miniLabel}>集計範囲</div>
              <div style={S.scrollRow}>
                <button onClick={() => setTotalGroupId(null)}
                  style={{ ...S.chip, ...(totalGroupId == null ? S.chipOn : {}) }}>
                  すべて
                  <span style={S.chipSub}>全{games.length}半荘</span>
                </button>
                {groups.map((g) => {
                  const key = [...g.memberIds].sort().join(",");
                  const cnt = games.filter((gm) => [...gm.entries.map((e) => e.memberId)].sort().join(",") === key).length;
                  return (
                    <button key={g.id} onClick={() => setTotalGroupId(g.id)}
                      style={{ ...S.chip, ...(totalGroupId === g.id ? S.chipOn : {}) }}>
                      {g.name}
                      <span style={S.chipSub}>{cnt}半荘</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div style={{ marginBottom: 16 }}>
            <div style={S.miniLabel}>期間</div>
            <div style={S.scrollRow}>
              {periodOptions.map((o) => (
                <button key={o.key} onClick={() => setPeriod(o.key)}
                  style={{ ...S.chip, ...(period === o.key ? S.chipOn : {}) }}>
                  {o.label}
                  {o.season && <span style={S.chipSub}>{o.season.closed ? "確定" : "進行中"}</span>}
                </button>
              ))}
            </div>
          </div>

          {ranked.length === 0 ? (
            <p style={S.empty}>
              {period !== "all"
                ? "この期間の記録はまだありません。"
                : totalGroupId == null ? "まだ記録がありません。" : "このグループ4人での対戦記録はまだありません。"}
            </p>
          ) : (
            <>
              <div style={S.totalHead}>
                <span style={S.totalHeadMain}>
                  {totalGroupId == null ? "全体累計" : groups.find((g) => g.id === totalGroupId)?.name}
                  {period !== "all" && (
                    <span style={S.periodTag}>{periodOptions.find((o) => o.key === period)?.label}</span>
                  )}
                </span>
                <span style={S.totalHeadSub}>{totalGames.length}半荘 · {totalDays}日</span>
              </div>

              {/* 順位表 */}
              <div style={S.section}>ランキング</div>
              <div style={{ ...S.scrollRow, marginBottom: 12 }}>
                {SORTS.map((o) => (
                  <button key={o.key} onClick={() => setSortKey(o.key)}
                    style={{ ...S.sortChip, ...(sortKey === o.key ? S.sortChipOn : {}) }}>
                    {o.label}
                  </button>
                ))}
              </div>
              {ranked.map((m, i) => {
                const st = totalStats[m.id];
                const isTop = i === 0;
                const medal = i < 3 ? ["#E8C766", "#C7C4BD", "#CD9A6A"][i] : null;
                return (
                  <button key={m.id} onClick={() => setDetailId(m.id)}
                    style={{ ...S.totalRow, ...(isTop ? S.totalRowTop : {}) }} className="press">
                    <span style={{ ...S.totalRank, ...(medal ? { background: medal, color: "#fff", boxShadow: "0 1px 3px rgba(0,0,0,.18)" } : {}) }}>
                      {i + 1}
                    </span>
                    <span style={{ ...S.totalStripe, background: memberColor(m.id) }} />
                    <Avatar id={m.id} size={34} />
                    <span style={{ ...S.totalBody, marginLeft: 9 }}>
                      <span style={{ ...S.totalName, ...(isTop ? { fontSize: 16 } : {}) }}>{m.name}</span>
                      <span style={S.totalMeta}>
                        {st.n}半荘 · 平均{st.avgRank.toFixed(2)}位 ·{" "}
                        {st.ranks.map((c, k) => (
                          <span key={k} style={{ color: c > 0 ? RANK_INK[k] : "#D5D2CB" }}>
                            {c}{k < 3 && <span style={{ color: "#DDD9D2" }}>·</span>}
                          </span>
                        ))}
                      </span>
                    </span>
                    <span style={S.totalPts}>
                      <b className={isTop ? "pop" : ""}
                        style={{
                          ...S.totalPtMain, fontSize: isTop ? 26 : 19,
                          color: isGood(st) ? PLUS_D : MINUS_D,
                        }}>
                        {sortKey === "point" ? signed(st.point)
                          : sortKey === "avgRank" ? st.avgRank.toFixed(2)
                          : sortKey === "top" ? `${st.top.toFixed(0)}%`
                          : sortKey === "avgPoint" ? signed(st.avgPoint)
                          : `${(100 - st.last).toFixed(0)}%`}
                      </b>
                      <span style={S.totalPtSub}>
                        {sortKey === "point" ? `平均 ${signed(st.avgPoint)}` : `合計 ${signed(st.point)}`}
                      </span>
                    </span>
                    <span style={S.chevron}>›</span>
                  </button>
                );
              })}

              {/* ハイライト */}
              {highlights && highlights.bestGame && (
                <>
                  <div style={{ ...S.section, marginTop: 24 }}>ハイライト</div>
                  <div style={S.hlGrid}>
                    <div style={S.hlCard}>
                      <span style={S.hlLabel}>最高点</span>
                      <b style={{ ...S.hlValue, color: PLUS_D }}>{highlights.bestGame.raw.toLocaleString()}</b>
                      <span style={S.hlSub}>
                        {memberName(highlights.bestGame.memberId)} · {formatDay(highlights.bestGame.date)}
                      </span>
                    </div>
                    <div style={S.hlCard}>
                      <span style={S.hlLabel}>最低点</span>
                      <b style={{ ...S.hlValue, color: MINUS_D }}>{highlights.worstGame.raw.toLocaleString()}</b>
                      <span style={S.hlSub}>
                        {memberName(highlights.worstGame.memberId)} · {formatDay(highlights.worstGame.date)}
                      </span>
                    </div>
                    <div style={S.hlCard}>
                      <span style={S.hlLabel}>トップ率</span>
                      <b style={{ ...S.hlValue, color: RANK_INK[0] }}>
                        {totalStats[highlights.byTop.id].top.toFixed(0)}%
                      </b>
                      <span style={S.hlSub}>{highlights.byTop.name}</span>
                    </div>
                    <div style={S.hlCard}>
                      <span style={S.hlLabel}>平均順位</span>
                      <b style={{ ...S.hlValue, color: FELT }}>
                        {totalStats[highlights.byRank.id].avgRank.toFixed(2)}
                      </b>
                      <span style={S.hlSub}>{highlights.byRank.name}</span>
                    </div>
                  </div>
                </>
              )}

              {/* 記録集（歴代ベスト） */}
              {records && (
                <>
                  <div style={{ ...S.section, marginTop: 24 }}>記録集</div>

                  <div style={S.recBoard}>
                    <div style={S.recBoardHead}>
                      <span style={S.recCrown}>♛</span>歴代最高得点
                    </div>
                    {records.topRaw.map((e, i) => (
                      <div key={`${e.memberId}-${e.date}-${e.raw}`}
                        style={{ ...S.recRow, ...(i === 0 ? S.recRowTop : {}) }}>
                        <span style={{ ...S.recNo, ...(i === 0 ? S.recNoTop : {}) }}>{i + 1}</span>
                        <span style={{ ...S.recName, color: memberColorD(e.memberId) }}>{memberName(e.memberId)}</span>
                        <span style={S.recDate}>{formatDay(e.date)}</span>
                        <b style={{ ...S.recVal, ...(i === 0 ? S.recValTop : {}) }}>
                          {e.raw.toLocaleString()}<span style={S.recUnit}> 点</span>
                        </b>
                      </div>
                    ))}
                  </div>

                  <div style={S.recGrid}>
                    {records.bestDay && (
                      <div style={S.recCard}>
                        <span style={S.recCardLabel}>1日の最高収支</span>
                        <b style={{ ...S.recCardVal, color: PLUS_D }}>{signed(records.bestDay.point)}</b>
                        <span style={S.recCardSub}>
                          {memberName(records.bestDay.memberId)} · {formatDay(records.bestDay.date)}
                        </span>
                      </div>
                    )}
                    {records.worstDay && (
                      <div style={S.recCard}>
                        <span style={S.recCardLabel}>1日の最低収支</span>
                        <b style={{ ...S.recCardVal, color: MINUS_D }}>{signed(records.worstDay.point)}</b>
                        <span style={S.recCardSub}>
                          {memberName(records.worstDay.memberId)} · {formatDay(records.worstDay.date)}
                        </span>
                      </div>
                    )}
                    {records.comeback && records.comeback.gain > 0 && (
                      <div style={S.recCard}>
                        <span style={S.recCardLabel}>最大の逆転</span>
                        <b style={{ ...S.recCardVal, color: T.gold }}>+{records.comeback.gain}</b>
                        <span style={S.recCardSub}>
                          {memberName(records.comeback.memberId)} · {records.comeback.from} → {signed(records.comeback.final)}
                        </span>
                      </div>
                    )}
                    {records.lowRaw[0] && (
                      <div style={S.recCard}>
                        <span style={S.recCardLabel}>歴代最低得点</span>
                        <b style={{ ...S.recCardVal, color: MINUS_D }}>{records.lowRaw[0].raw.toLocaleString()}</b>
                        <span style={S.recCardSub}>
                          {memberName(records.lowRaw[0].memberId)} · {formatDay(records.lowRaw[0].date)}
                        </span>
                      </div>
                    )}
                  </div>

                  {/* 連続記録 */}
                  {(() => {
                    const rows = [
                      { key: "topRun", now: "nowTop", label: "連続トップ", unit: "連続" },
                      { key: "renRun", now: "nowRen", label: "連続連対", unit: "連続" },
                      { key: "noLastRun", now: "nowNoLast", label: "ラスなし", unit: "半荘" },
                    ];
                    return (
                      <div style={S.recBoard}>
                        <div style={S.recBoardHead}>連続記録</div>
                        {rows.map((r) => {
                          const best = records.pick(r.key);
                          if (!best || best[r.key] < 2) return null;
                          const ongoing = records.streaks.filter((x) => x[r.now] >= 2)
                            .sort((a, b) => b[r.now] - a[r.now])[0];
                          return (
                            <div key={r.key} style={S.recRow}>
                              <span style={S.recStreakLabel}>{r.label}</span>
                              <span style={{ ...S.recName, color: memberColorD(best.memberId) }}>
                                {memberName(best.memberId)}
                              </span>
                              <b style={S.recVal}>
                                {best[r.key]}<span style={S.recUnit}> {r.unit}</span>
                              </b>
                              {ongoing && (
                                <span style={S.recNow}>
                                  継続中 {memberName(ongoing.memberId)} {ongoing[r.now]}
                                </span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}
                </>
              )}

              <div style={{ ...S.section, marginTop: 24 }}>ポイントの推移</div>
              <Chart ids={ranked.map((m) => m.id)} gameList={totalGames} />
            </>
          )}
        </div>
      )}

      {tab === "members" && (
        <>
          <div style={S.card} className="tabview card-tex">
            <div style={S.section}>メンバー</div>
            <div style={S.inputRow}>
              <input style={S.nameInput} value={newName} placeholder="名前を入力"
                onChange={(e) => setNewName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addMember()} />
              <button style={S.addBtn} onClick={addMember}>追加</button>
            </div>
            {err && <p style={S.err}>{err}</p>}
            {members.length === 0 ? (
              <p style={S.empty}>よく打つ相手を登録しておくと、毎回選ぶだけで記録できます。</p>
            ) : (
              members.map((m) => (
                <div key={m.id} style={S.memberRow}>
                  <span style={{ ...S.memberStripe, background: memberColor(m.id) }} />
                  <button style={S.avatarBtn} title="アイコンを変える"
                    onClick={() => { setAvatarPick(m.id); setErr(""); }}>
                    <Avatar id={m.id} size={32} />
                  </button>
                  {editId === m.id ? (
                    <>
                      <input style={S.memberInputOn} value={editText} autoFocus
                        onChange={(e) => setEditText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") setEditId(null); }} />
                      <button style={S.editDone} onClick={commitEdit}>保存</button>
                      <button style={S.editCancel} onClick={() => setEditId(null)}>やめる</button>
                    </>
                  ) : (
                    <>
                      <span style={S.memberName}>{m.name}</span>
                      <button style={S.editBtn} title="名前を変更"
                        onClick={() => { setEditId(m.id); setEditText(m.name); setErr(""); }}>✎</button>
                      <span style={S.memberCount}>{playedCount(m.id)}半荘</span>
                    </>
                  )}
                  {editId !== m.id && <button style={S.xBtn}
                    onClick={() => playedCount(m.id) > 0
                      ? setErr("対戦記録があるメンバーは削除できません。")
                      : setConfirmAsk({
                          title: `${m.name} を削除しますか？`,
                          note: "対戦記録はありません。所属グループからも外れます。",
                          onOk: () => deleteMember(m.id),
                        })}>×</button>}
                </div>
              ))
            )}
          </div>

          <div style={{ ...S.card, marginTop: 12 }} className="card-tex">
            <div style={S.section}>グループ</div>
            <p style={S.hint}>いつもの4人を登録すると、入力画面でまとめて呼び出せます。</p>

            {groups.map((g) => (
              <div key={g.id} style={S.groupRow}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={S.groupName}>{g.name}</div>
                  <div style={S.groupMembers}>
                    {g.memberIds.map((id) => (
                      <span key={id} style={S.groupTag}>
                        <span style={{ ...S.tagDot, background: memberColor(id) }} />
                        {memberName(id)}
                      </span>
                    ))}
                  </div>
                </div>
                <button style={S.xBtn}
                  onClick={() => setConfirmAsk({
                    title: `グループ「${g.name}」を削除しますか？`,
                    note: "対戦記録はそのまま残ります。",
                    onOk: () => {
                              rpc("del_group", { id: g.id })
                                .then(() => setGroups((prev) => prev.filter((x) => x.id !== g.id)))
                                .catch(() => setErr(NET_ERR));
                            },
                  })}>×</button>
              </div>
            ))}

            {!showGroupForm ? (
              <button style={{ ...S.secondary, ...(members.length < 4 ? S.primaryOff : {}) }}
                onClick={() => { setShowGroupForm(true); setErr(""); setGroupDraft([]); }}
                disabled={members.length < 4}>
                {members.length < 4 ? "メンバーが4人以上必要です" : "＋ グループを作る"}
              </button>
            ) : (
              <div style={S.groupForm}>
                <input style={S.groupNameInput} value={newGroupName}
                  placeholder="グループ名（例: 金曜メンツ）"
                  onChange={(e) => setNewGroupName(e.target.value)} />
                <div style={{ ...S.miniLabel, marginTop: 12 }}>席順に4人選ぶ（{groupDraft.length}/4）</div>
                <div style={S.pickGrid}>
                  {members.map((m) => {
                    const idx = groupDraft.indexOf(m.id);
                    const on = idx >= 0;
                    return (
                      <button key={m.id} onClick={() => toggleDraft(m.id)}
                        style={{ ...S.pickBtn, ...(on ? { background: memberColor(m.id), color: "#fff", borderColor: memberColor(m.id) } : {}) }}>
                        {on && <span style={S.pickNum}>{idx + 1}</span>}
                        {m.name}
                      </button>
                    );
                  })}
                </div>
                {err && <p style={S.err}>{err}</p>}
                <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                  <button style={{ ...S.secondary, flex: 1, marginTop: 0 }}
                    onClick={() => { setShowGroupForm(false); setErr(""); }}>やめる</button>
                  <button style={{ ...S.primary, flex: 1, marginTop: 0 }} onClick={saveGroup}>保存</button>
                </div>
              </div>
            )}
          </div>

          <div style={{ ...S.card, marginTop: 12 }} className="card-tex">
            <div style={S.section}>シーズン</div>
            <p style={S.hint}>期間を区切って戦うと、累計タブでその期間だけの順位が見られます。</p>
            {seasons.length > 0 && (
              <div style={{ marginBottom: 10 }}>
                {[...seasons].sort((a, b) => (a.start < b.start ? 1 : -1)).map((sn) => {
                  const cnt = games.filter((g) => g.date >= sn.start && (!sn.end || g.date <= sn.end)).length;
                  const aw = seasonSummaries[sn.id];
                  return (
                    <div key={sn.id} style={S.seasonCard}>
                      <div style={S.seasonCardHead}>

const toHalf = (str) =>
  String(str)
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[ー−–—〜]/g, "-")
    .replace(/[，、]/g, "");

const signed = (v) => `${v > 0 ? "+" : ""}${v}`;

const todayISO = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

// 4人の素点から、着順とポイントを求める（同点は順位点を均等に分ける）
const buildEntries = (memberIds, nums) => {
  const order = [0, 1, 2, 3].sort((a, b) => nums[b] - nums[a]);
  const rankOf = {}, bonusOf = {};
  let i = 0;
  while (i < 4) {
    let j = i;
    while (j + 1 < 4 && nums[order[j + 1]] === nums[order[i]]) j++;
    const shared = RANK_POINTS.slice(i, j + 1).reduce((a, b) => a + b, 0) / (j - i + 1);
    for (let k = i; k <= j; k++) {
      rankOf[order[k]] = i + 1;
      bonusOf[order[k]] = shared;
    }
    i = j + 1;
  }
  return [0, 1, 2, 3].map((s) => ({
    memberId: memberIds[s],
    rank: rankOf[s],
    raw: nums[s],
    point: Math.round(((nums[s] - RETURN) / 1000 + bonusOf[s]) * 10) / 10,
  }));
};

const formatDay = (iso) => {
  const [, m, d] = iso.split("-");
  const w = ["日", "月", "火", "水", "木", "金", "土"][new Date(`${iso}T00:00:00`).getDay()];
  return `${Number(m)}/${Number(d)} ${w}`;
};
